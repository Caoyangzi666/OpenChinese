<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f5ef"><title>OpenChinese</title><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="theme.css"></head><body>
<header id="header"><div class="brand"><img src="logo.svg" alt="自由"><div><b>OpenChinese</b><small>Read freely. Learn deeply.</small></div></div><span class="version">EARLY ACCESS</span></header>
<main id="main"></main>
<nav id="nav"><button data-tab="library" class="active"><span>▤</span>Library</button><button data-tab="cards"><span>▱</span>Flashcards</button><button data-tab="settings"><span>☷</span>Settings</button></nav>
<section id="reader" hidden><div class="reader-bar"><button id="closeReader" class="icon" aria-label="Back to library">←</button><div><b id="readerTitle"></b><small id="chapterLabel"></small></div><button id="readerOptions" class="pill">HSK 3</button></div><iframe id="page" title="Book chapter" sandbox="allow-same-origin"></iframe><div class="reader-bottom"><button id="prevChapter" aria-label="Previous page">←</button><button id="chapterPicker">Chapters</button><span id="tokenCount"></span><button id="nextChapter" aria-label="Next page">→</button></div></section>
<div id="backdrop" hidden></div><section id="sheet" class="sheet" hidden aria-modal="true" role="dialog"></section><div id="toast" role="status"></div>
<script src="engine.js"></script><script src="reader.js"></script><script src="app.js"></script></body></html>

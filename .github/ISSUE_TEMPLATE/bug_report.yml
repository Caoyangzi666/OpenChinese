name: Bug report
description: Report a reading, HSK, flashcard or display issue
body:
  - type: input
    id: version
    attributes:
      label: App version and Android version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: textarea
    id: hsk
    attributes:
      label: HSK example, if relevant
      description: Exact word, selected level, expected word level and a short passage you are permitted to share.
  - type: textarea
    id: media
    attributes:
      label: Screenshots or recording
      description: Exclude private information and complete copyrighted books.
